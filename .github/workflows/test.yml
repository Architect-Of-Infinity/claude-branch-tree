name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in extension/src/*.js extension/options/*.js extension/vault/*.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log(m.name, m.version)"
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run tests (tree, page hook, vault, simulated claude.ai pages)
        working-directory: tests
        run: npm test
