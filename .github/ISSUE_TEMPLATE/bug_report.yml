name: Bug report
description: Something doesn't work on claude.ai
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        claude.ai changes its page often, and most bugs are a selector that moved. **Diagnostics** says which part broke.
        Open the panel → ⋯ → **Diagnostics** → **Copy as JSON**, and paste it below. (It contains no message text.)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics JSON
      render: json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "2.2.0 (shown at the top of Diagnostics)"
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 142 on Windows 11"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed anything private from screenshots and text above.
          required: true
